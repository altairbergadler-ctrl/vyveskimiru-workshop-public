# Add to the app-only Compose file. Caddy supplies HTTPS; the app handles login.
# docker compose -f compose.host-proxy.yaml -f compose.password.yaml up -d
services:
  app:
    environment:
      EDITOR_AUTH_FILE: /run/secrets/editor_auth.json
    volumes:
      - type: bind
        source: ${EDITOR_AUTH_HOST_FILE:?Set absolute path to the private authentication JSON}
        target: /run/secrets/editor_auth.json
        read_only: true
        bind:
          create_host_path: false
