name: stamp-service

services:
  stamp:
    build: .
    image: stamp-service:local
    restart: unless-stopped
    init: true
    user: "10001:10001"
    ports:
      - "127.0.0.1:${HOST_PORT:-8187}:8080"
    env_file:
      - .env
    environment:
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Run bash scripts/setup.sh to create .env}
      DATA_DIR: /data
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-0}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_PAGES: ${MAX_PAGES:-50}
      MAX_JOBS: ${MAX_JOBS:-100}
      MAX_TOTAL_MB: ${MAX_TOTAL_MB:-500}
      MAX_RESULT_MB: ${MAX_RESULT_MB:-100}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
