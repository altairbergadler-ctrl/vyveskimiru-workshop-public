<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f0">
    <meta name="robots" content="noindex">
    <title>CRM временно отключена · Мастерская</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f6f5f0; color: #202821; font: 16px/1.6 system-ui, sans-serif; }
      main { width: 100%; max-width: 540px; padding: clamp(24px, 6vw, 48px); border: 1px solid #dedfd5; border-radius: 24px; background: #fffefa; }
      .brand { margin: 0 0 28px; font-size: 12px; font-weight: 700; letter-spacing: .16em; color: #687363; }
      h1 { margin: 0 0 20px; font-size: clamp(26px, 6vw, 36px); line-height: 1.15; letter-spacing: -.03em; }
      p { margin: 0 0 16px; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      a { display: inline-flex; align-items: center; min-height: 48px; padding: 10px 18px; border: 1px solid #273b2b; border-radius: 12px; color: #273b2b; font-weight: 600; text-decoration: none; }
      a:first-child { background: #273b2b; color: white; }
      a:focus-visible { outline: 3px solid #849e6c; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">МАСТЕРСКАЯ</p>
      <h1>CRM временно отключена</h1>
      <p>Задачи и заметки сохранены. Раздел вернётся после переработки.</p>
      <p>Клиенты и их контакты по-прежнему доступны в карточках заказов.</p>
      <nav aria-label="Рабочие разделы">
        <a href="/kanban/">Открыть заказы</a>
        <a href="/">Главная</a>
      </nav>
    </main>
  </body>
</html>
